<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Task Board</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #eceef2; --card: #ffffff; --text: #1b1f24; --muted: #5f6b7a;
  --line: #d9dde3; --accent: #0f7b6c; --urgent: #d1372e; --normal: #3b6fd8; --low: #9aa4b2;
  --chip: #e3e7ed; --chip-on: #1b1f24; --chip-on-text: #fff; --news: #b25e00; --news-bg: #fff3e0;
  --pending: #6a3fc1; --pending-bg: #efe8fb; --err-bg: #fdecea; --btn: #e3e7ed;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151a; --panel: #1a1e25; --card: #232831; --text: #e6e9ee; --muted: #9aa4b2;
    --line: #2e3440; --accent: #3fc1a8; --urgent: #ff6b5f; --normal: #6f9bff; --low: #6b7480;
    --chip: #2a3039; --chip-on: #e6e9ee; --chip-on-text: #12151a; --news: #ffb35c; --news-bg: #3a2a14;
    --pending: #c3a6ff; --pending-bg: #2e2445; --err-bg: #3a1c1a; --btn: #2f3641;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151a; --panel: #1a1e25; --card: #232831; --text: #e6e9ee; --muted: #9aa4b2;
  --line: #2e3440; --accent: #3fc1a8; --urgent: #ff6b5f; --normal: #6f9bff; --low: #6b7480;
  --chip: #2a3039; --chip-on: #e6e9ee; --chip-on-text: #12151a; --news: #ffb35c; --news-bg: #3a2a14;
  --pending: #c3a6ff; --pending-bg: #2e2445; --err-bg: #3a1c1a; --btn: #2f3641;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden;
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; }
[hidden] { display: none !important; }
header { padding: 16px 20px 8px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
h1 { margin: 0; font-size: 20px; }
.stamp { color: var(--muted); font-size: 12px; }
.stamp.stale { color: var(--urgent); font-weight: 600; }
.hbtns { margin-left: auto; display: flex; gap: 6px; }
.hbtn { background: var(--chip); color: var(--text); border: 0; border-radius: 6px; padding: 6px 12px; min-height: 36px; cursor: pointer; }
.hbtn:disabled { opacity: .6; cursor: default; }
.ftoggle { display: none; }
.filters { padding: 4px 20px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters input[type=search], .filters select { background: var(--card); color: var(--text); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; font: inherit; min-height: 36px; }
.filters input[type=search] { width: 220px; max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--chip); color: var(--text); border: 0; border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
.chip.on { background: var(--chip-on); color: var(--chip-on-text); }
.banner { margin: 0 20px 12px; padding: 10px 12px; border-radius: 8px; background: var(--err-bg); color: var(--text);
  border: 1px solid var(--urgent); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.banner b { color: var(--urgent); }
.banner .hbtn { margin-left: auto; }
.tabs { display: none; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(270px, 1fr); gap: 12px;
  padding: 0 20px 20px; overflow-x: auto; align-items: start; }
.col { background: var(--panel); border-radius: 10px; padding: 10px; min-height: 120px; min-width: 0; }
.col h2 { margin: 2px 4px 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; display: flex; justify-content: space-between; }
.col h2 .n { color: var(--muted); font-weight: 500; }
.col .hint { color: var(--muted); font-size: 11px; margin: -6px 4px 8px; }
.cards { display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 200px); overflow-y: auto; }
.card { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--normal); border-radius: 8px; padding: 9px 10px; min-width: 0; }
.card.urgent { border-left-color: var(--urgent); }
.card.low { border-left-color: var(--low); }
.card.is-pending { border-style: dashed; border-left-style: solid; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 11px; color: var(--muted); }
.tag { background: var(--chip); border-radius: 4px; padding: 1px 6px; color: var(--text); }
.src { font-weight: 600; color: var(--accent); }
.pend { background: var(--pending-bg); color: var(--pending); border-radius: 4px; padding: 1px 6px; font-weight: 600; }
.title { font-weight: 600; margin: 5px 0 2px; overflow-wrap: anywhere; }
.title a { color: inherit; text-decoration: none; }
.title a:hover { text-decoration: underline; }
.body { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.reason { font-style: italic; font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
.news { display: inline-block; margin-top: 6px; background: var(--news-bg); color: var(--news); border-radius: 4px; padding: 1px 6px; font-size: 11.5px; }
.foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 11px; color: var(--muted); }
.foot a { color: var(--accent); }
.acts { display: flex; gap: 8px; margin-top: 8px; }
.act { flex: 1; min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--btn); color: var(--text);
  font-weight: 600; cursor: pointer; touch-action: manipulation; }
.act.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .act.primary { color: #0b1512; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .act.primary { color: #0b1512; } }
.act:disabled { opacity: .5; cursor: default; }
.more { width: 100%; margin-top: 4px; min-height: 40px; }
.wstat { margin-top: 8px; padding: 6px 8px; border-radius: 6px; background: var(--pending-bg); color: var(--text); font-size: 12.5px; overflow-wrap: anywhere; }
.wstat b { color: var(--pending); }
.thread { margin-top: 8px; }
.thread summary { cursor: pointer; color: var(--accent); font-size: 12px; padding: 6px 0; }
.msg { margin: 6px 0; padding: 6px 8px; border-radius: 6px; font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--chip); }
.msg.duong { background: var(--btn); margin-left: 24px; }
.msg.claude { background: var(--pending-bg); margin-right: 24px; }
.msg.bot { background: var(--news-bg); color: var(--news); }
.msg .who { display: block; font-size: 10.5px; color: var(--muted); margin-bottom: 2px; }
.compose { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.compose label { font-size: 11.5px; color: var(--muted); }
.compose textarea { width: 100%; min-height: 64px; resize: vertical; background: var(--bg); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.compose.draft textarea { border-color: var(--pending); min-height: 96px; }
.empty { color: var(--muted); font-size: 12px; padding: 8px 4px; }
.setup { max-width: 520px; margin: 40px auto; padding: 0 16px; }
.setup .box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.setup h2 { margin: 0 0 8px; font-size: 18px; }
.setup p { color: var(--muted); margin: 6px 0 12px; }
.setup input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; min-height: 44px; }
.setup .row { display: flex; gap: 8px; margin-top: 12px; }
.setup .act { flex: 0 1 auto; padding: 0 20px; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  width: max-content; max-width: calc(100% - 32px); background: var(--chip-on); color: var(--chip-on-text); padding: 10px 14px; border-radius: 8px;
  font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.25); z-index: 20; }
.toast.err { background: var(--urgent); color: #fff; }
footer { padding: 4px 20px 24px; color: var(--muted); font-size: 12px; display: flex; gap: 12px; align-items: center; }
.linkbtn { background: none; border: 0; color: var(--accent); padding: 8px 0; cursor: pointer; text-decoration: underline; }
@media (max-width: 700px) {
  header, .filters, footer { padding-left: 16px; padding-right: 16px; }
  .banner { margin-left: 16px; margin-right: 16px; }
  .ftoggle { display: inline-block; }
  .filters:not(.open) { display: none; }
  .filters input[type=search] { width: 100%; }
  .filters select { flex: 1 1 40%; min-width: 0; }
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; position: sticky; top: 0; z-index: 10;
    background: var(--bg); padding: 8px 16px; border-bottom: 1px solid var(--line); }
  .tab { background: var(--chip); color: var(--text); border: 0; border-radius: 8px; padding: 6px 2px; min-height: 48px; min-width: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; line-height: 1.2; }
  .tab .n { font-size: 15px; font-weight: 700; }
  .tab.on { background: var(--chip-on); color: var(--chip-on-text); }
  .board { display: block; overflow-x: visible; padding: 12px 16px 16px; }
  .col { display: none; }
  .col.active { display: block; }
  .cards { max-height: none; overflow: visible; }
}
</style>
</head>
<body>
<section class="setup" id="setup" hidden>
  <div class="box">
    <h2>Connect the task board</h2>
    <p>Paste a GitHub fine-grained personal access token with <b>Contents: read and write</b> on
      <code>duong-vsee/task-dashboard-data</code>. It is kept only in this browser's local storage.</p>
    <form id="setupForm">
      <input type="password" id="tokenInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…" aria-label="GitHub token">
      <div class="row">
        <button class="act primary" type="submit">Save token</button>
      </div>
    </form>
    <p id="setupMsg"></p>
  </div>
</section>

<div id="app" hidden>
<header>
  <h1>Task Board</h1>
  <span class="stamp" id="stamp">Loading…</span>
  <div class="hbtns">
    <button class="hbtn ftoggle" id="ftoggle" type="button" aria-expanded="false">Filters</button>
    <button class="hbtn" id="refresh" type="button">Refresh</button>
    <button class="hbtn" id="theme" type="button" aria-label="Toggle theme">Theme</button>
  </div>
</header>
<div class="filters" id="filters">
  <input type="search" id="q" placeholder="Search title, body, person…">
  <select id="project"><option value="">All projects</option></select>
  <select id="priority"><option value="">Any priority</option><option>urgent</option><option>normal</option><option>low</option></select>
  <span class="chips" id="sources"></span>
</div>
<div id="banner" class="banner" hidden></div>
<nav class="tabs" id="tabs"></nav>
<main class="board" id="board"></main>
<footer>
  <button class="linkbtn" id="forget" type="button">Forget token</button>
</footer>
</div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
"use strict";
const REPO = "duong-vsee/task-dashboard-data";
const BRANCH = "main";
const API = `https://api.github.com/repos/${REPO}/contents`;
const TOKEN_KEY = "task-board-token";
const REFRESH_MS = 2 * 60 * 1000;
const STALE_MS = 2 * 3600 * 1000;
const COLS = [
  { id: "todo", name: "To do", short: "To do", hint: () => "Needs action" },
  { id: "progress", name: "In progress", short: "Working", hint: () => "Claude is on it" },
  { id: "needs", name: "Needs you", short: "Needs you", hint: () => "A reply to approve or a question" },
  { id: "waiting", name: "Waiting", short: "Waiting", hint: () => "Waiting on someone else" },
  { id: "ready", name: "Ready to close", short: "Ready", hint: () => "Claude thinks it's finished · tap Done to confirm" },
  { id: "fyi", name: "FYI", short: "FYI", hint: () => "Info only" },
  { id: "auto", name: "Auto-done", short: "Auto", hint: d => `Closed by the bot · last ${d} days` },
  { id: "done", name: "Done", short: "Done", hint: d => `Last ${d} days` },
  { id: "skipped", name: "Skipped", short: "Skipped", hint: () => "" },
];
const TARGET = { done: "done", skip: "skipped", reopen: "todo", ask: "progress", send: "progress" };
const ACTION_LABEL = { done: "done", skip: "skip", reopen: "reopen", ask: "message to Claude", send: "reply" };
const WORK_COL = { queued: "progress", running: "progress", needs_you: "needs", waiting: "waiting", ready: "ready" };
const CLOSED_COLS = ["done", "auto", "skipped"];
const SRC = { slack: "Slack", bitbucket: "Bitbucket", hub: "Hub", asana: "Asana", phoenix: "Phoenix", merge_request: "Merge" };
const PRI = { urgent: 0, normal: 1, low: 2 };
const PAGE = 40;

const state = { q: "", project: "", priority: "", sources: new Set(), shown: {}, tab: "todo" };
const typed = new Map();      // composer text per card+box, kept across re-renders
const openBoxes = new Set();  // "id" -> composer open; "t:id" -> thread open
let renderDeferred = false;
let DATA = null;          // last good board.json
let filePending = new Map(); // id -> {action, at}  from actions/ files on the server
const localPending = new Map(); // id -> {action, at, inflight}  clicks made in this tab
let loading = false;
let errorKind = null;

const $ = id => document.getElementById(id);

function store(op, key, value) {
  try {
    if (op === "get") return localStorage.getItem(key);
    if (op === "set") return localStorage.setItem(key, value);
    if (op === "del") return localStorage.removeItem(key);
  } catch (e) { /* storage unavailable */ }
  return null;
}

/* ---------- theme ---------- */
function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); }
applyTheme(store("get", "task-board-theme"));
$("theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  applyTheme(next); store("set", "task-board-theme", next);
};

/* ---------- helpers ---------- */
function ago(iso) {
  if (!iso) return "";
  const t = new Date(iso).getTime();
  if (isNaN(t)) return "";
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (m < 1) return "just now";
  if (m < 60) return `${m}m ago`;
  if (m < 48 * 60) return `${Math.round(m / 60)}h ago`;
  return `${Math.round(m / 1440)}d ago`;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function safeHref(u, schemes) {
  if (typeof u !== "string" || !u) return null;
  try { const p = new URL(u); return schemes.includes(p.protocol) ? u : null; } catch (e) { return null; }
}
function b64utf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function rand6() {
  const a = "abcdefghijklmnopqrstuvwxyz0123456789";
  const b = new Uint8Array(6);
  crypto.getRandomValues(b);
  return Array.from(b, x => a[x % a.length]).join("");
}
let toastTimer = null;
function toast(msg, isErr) {
  const t = $("toast");
  t.textContent = msg;
  t.className = isErr ? "toast err" : "toast";
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, isErr ? 6000 : 2500);
}

/* ---------- token / setup ---------- */
function getToken() { return store("get", TOKEN_KEY); }
function showSetup(msg) {
  $("app").hidden = true;
  $("setup").hidden = false;
  $("setupMsg").textContent = msg || "";
  $("tokenInput").value = "";
}
function showApp() { $("setup").hidden = true; $("app").hidden = false; }
$("setupForm").onsubmit = e => {
  e.preventDefault();
  const v = $("tokenInput").value.trim();
  if (!v) { $("setupMsg").textContent = "Paste a token first."; return; }
  store("set", TOKEN_KEY, v);
  $("tokenInput").value = "";
  if (getToken() !== v) toast("Could not save the token in this browser (storage blocked); it will last for this tab only.", true);
  sessionToken = v;
  showApp();
  load();
};
let sessionToken = null;
function token() { return getToken() || sessionToken; }
function forgetToken() {
  store("del", TOKEN_KEY);
  sessionToken = null;
  DATA = null; filePending = new Map(); localPending.clear();
  showSetup("Token forgotten.");
}
$("forget").onclick = forgetToken;

/* ---------- GitHub API ---------- */
class ApiError extends Error {
  constructor(status, msg) { super(msg); this.status = status; }
}
async function gh(path, opts = {}) {
  const headers = {
    "Authorization": `Bearer ${token()}`,
    "X-GitHub-Api-Version": "2022-11-28",
    "Accept": opts.accept || "application/vnd.github+json",
  };
  if (opts.body) headers["Content-Type"] = "application/json";
  let res;
  try {
    res = await fetch(`${API}/${path}${opts.method && opts.method !== "GET" ? "" : `?ref=${BRANCH}`}`, {
      method: opts.method || "GET", headers, body: opts.body, cache: "no-store",
    });
  } catch (e) {
    throw new ApiError(0, "network");
  }
  if (!res.ok) throw new ApiError(res.status, `HTTP ${res.status}`);
  return res;
}

async function fetchPending() {
  let list;
  try {
    list = await (await gh("actions")).json();
  } catch (e) {
    if (e.status === 404) return new Map();
    throw e;
  }
  if (!Array.isArray(list)) return new Map();
  const files = list.filter(f => f && f.type === "file" && /\.json$/i.test(f.name));
  const results = await Promise.all(files.map(async f => {
    try {
      const r = await gh(`actions/${encodeURIComponent(f.name)}`, { accept: "application/vnd.github.raw+json" });
      const j = JSON.parse(await r.text());
      if (j && typeof j.id === "string" && TARGET[j.action]) return { id: j.id, action: j.action, at: j.at || "", name: f.name };
    } catch (e) {
      if (e.status === 401) throw e;
    }
    return null;
  }));
  const m = new Map();
  results.filter(Boolean)
    .sort((a, b) => (a.at || a.name).localeCompare(b.at || b.name))
    .forEach(p => m.set(p.id, p)); // latest click per card wins
  return m;
}

async function load() {
  if (!token()) { showSetup(); return; }
  if (loading) return;
  loading = true;
  $("refresh").disabled = true;
  $("refresh").textContent = "Refreshing…";
  try {
    const [boardRes, pend] = await Promise.all([
      gh("board.json", { accept: "application/vnd.github.raw+json" }),
      fetchPending(),
    ]);
    const data = JSON.parse(await boardRes.text());
    if (!data || !Array.isArray(data.cards)) throw new ApiError(-1, "bad board");
    DATA = data;
    filePending = pend;
    // Completed local clicks are now represented by the server's action files (or already applied).
    for (const [id, p] of localPending) if (!p.inflight) localPending.delete(id);
    setError(null);
  } catch (e) {
    setError(e);
  } finally {
    loading = false;
    $("refresh").disabled = false;
    $("refresh").textContent = "Refresh";
    renderAll();
  }
}

function setError(e) {
  const b = $("banner");
  b.replaceChildren();
  errorKind = null;
  if (!e) { b.hidden = true; return; }
  const s = e.status;
  let head, text, btn = null;
  if (s === 401) {
    errorKind = "auth";
    head = "Token rejected."; text = "The GitHub token is invalid or expired.";
    btn = el("button", "hbtn", "Re-enter token"); btn.type = "button"; btn.onclick = forgetToken;
  } else if (s === 403 || s === 404) {
    head = s === 403 ? "No access." : "Board not found.";
    text = `Either this token has no access to ${REPO}, or board.json has not been published yet.`;
    btn = el("button", "hbtn", "Change token"); btn.type = "button"; btn.onclick = forgetToken;
  } else if (s === 0) {
    head = "Network error."; text = "Could not reach GitHub. Showing the last loaded board, if any.";
  } else if (s === -1) {
    head = "Bad data."; text = "board.json could not be read as a board.";
  } else {
    head = `GitHub error (${s || "?"}).`; text = "Try Refresh in a moment.";
  }
  b.append(el("b", null, head), el("span", null, text));
  if (btn) b.append(btn);
  b.hidden = false;
}

/* ---------- actions ---------- */
function pendingFor(id) { return localPending.get(id) || filePending.get(id) || null; }
function effectiveCol(c) {
  const p = pendingFor(c.id);
  return p ? TARGET[p.action] : c.col;
}

async function act(c, action, text) {
  if (localPending.get(c.id)?.inflight) return;
  const at = new Date().toISOString();
  const prev = localPending.get(c.id);
  localPending.set(c.id, { action, at, inflight: true });
  renderAll(true);
  const name = `${Date.now()}-${rand6()}.json`;
  const payload = JSON.stringify(text ? { id: c.id, action, at, text } : { id: c.id, action, at });
  try {
    await gh(`actions/${name}`, {
      method: "PUT",
      body: JSON.stringify({ message: `board: ${action} ${c.id}`, content: b64utf8(payload), branch: BRANCH }),
    });
    localPending.set(c.id, { action, at, inflight: false });
    typed.delete(`${c.id}|msg`); typed.delete(`${c.id}|draft`); openBoxes.delete(c.id);
    toast(action === "ask" || action === "send"
      ? `Sent ${ACTION_LABEL[action]} · picked up in a few minutes`
      : `Marked ${ACTION_LABEL[action]} · the bot applies it in a few minutes`);
  } catch (e) {
    if (prev) localPending.set(c.id, prev); else localPending.delete(c.id);
    const why = e.status === 401 ? "token rejected" : e.status === 0 ? "network error"
      : e.status === 403 || e.status === 404 ? "no write access" : `HTTP ${e.status}`;
    toast(`Could not save "${ACTION_LABEL[action]}" (${why}). Card moved back.`, true);
    if (e.status === 401) setError(e);
  }
  renderAll(true);
}

/* ---------- filters ---------- */
$("q").oninput = e => { state.q = e.target.value.toLowerCase(); render(); };
$("project").onchange = e => { state.project = e.target.value; render(); };
$("priority").onchange = e => { state.priority = e.target.value; render(); };
$("ftoggle").onclick = () => {
  const f = $("filters");
  f.classList.toggle("open");
  $("ftoggle").setAttribute("aria-expanded", String(f.classList.contains("open")));
};
state.tab = COLS.some(c => c.id === store("get", "task-board-tab")) ? store("get", "task-board-tab") : "todo";

function rebuildFilterOptions() {
  const cards = DATA ? DATA.cards : [];
  const sel = $("project");
  const projects = [...new Set(cards.map(c => c.project).filter(Boolean))].sort();
  if (state.project && !projects.includes(state.project)) projects.push(state.project);
  sel.replaceChildren(new Option("All projects", ""));
  projects.forEach(p => sel.append(new Option(p, p)));
  sel.value = state.project;
  const box = $("sources");
  box.replaceChildren();
  const srcs = new Set(cards.map(c => c.source).filter(Boolean));
  state.sources.forEach(s => srcs.add(s));
  [...srcs].sort().forEach(s => {
    const b = el("button", "chip" + (state.sources.has(s) ? " on" : ""), SRC[s] || s);
    b.type = "button";
    b.setAttribute("aria-pressed", String(state.sources.has(s)));
    b.onclick = () => {
      state.sources.has(s) ? state.sources.delete(s) : state.sources.add(s);
      b.classList.toggle("on"); b.setAttribute("aria-pressed", String(state.sources.has(s)));
      render();
    };
    box.append(b);
  });
}
function activeFilterCount() {
  return (state.q ? 1 : 0) + (state.project ? 1 : 0) + (state.priority ? 1 : 0) + state.sources.size;
}
function matches(c) {
  if (state.project && c.project !== state.project) return false;
  if (state.priority && c.priority !== state.priority) return false;
  if (state.sources.size && !state.sources.has(c.source)) return false;
  if (state.q && !`${c.title} ${c.body} ${c.who} ${c.reason} ${c.news}`.toLowerCase().includes(state.q)) return false;
  return true;
}

/* ---------- rendering ---------- */
function updateStamp() {
  const s = $("stamp");
  s.classList.remove("stale");
  if (!DATA) { s.textContent = loading ? "Loading…" : "No data"; return; }
  const g = new Date(DATA.generated).getTime();
  const stale = !isNaN(g) && Date.now() - g > STALE_MS;
  s.textContent = `Updated ${ago(DATA.generated) || "?"}${stale ? " · stale" : ""}`;
  s.title = isNaN(g) ? "" : new Date(g).toLocaleString();
  if (stale) s.classList.add("stale");
}

function card(c) {
  const p = pendingFor(c.id);
  const col = effectiveCol(c);
  const d = el("article", `card ${PRI[c.priority] !== undefined ? c.priority : "normal"}${p ? " is-pending" : ""}`);
  d.dataset.id = c.id;
  const meta = el("div", "meta");
  meta.append(el("span", "src", SRC[c.source] || c.source || "?"));
  if (c.project) meta.append(el("span", "tag", c.project));
  if (c.kind) meta.append(el("span", "tag", c.kind));
  if (c.priority === "urgent") meta.append(el("span", "tag", "urgent"));
  if (p) meta.append(el("span", "pend", p.inflight ? `saving ${ACTION_LABEL[p.action]}…` : `pending ${ACTION_LABEL[p.action]}`));
  d.append(meta);
  const t = el("div", "title");
  const label = c.who ? `${c.who} — ${c.title || ""}` : (c.title || "(untitled)");
  const href = safeHref(c.url, ["https:", "http:"]);
  if (href) {
    const a = el("a", null, label);
    a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
    t.append(a);
  } else t.textContent = label;
  d.append(t);
  if (c.body) d.append(el("div", "body", c.body));
  if (c.reason) d.append(el("div", "reason", c.reason));
  if (c.news) d.append(el("span", "news", `🔔 ${c.news}`));
  const f = el("div", "foot");
  f.append(el("span", null, c.closed ? `closed ${ago(c.closed)}` : c.seen ? `seen ${ago(c.seen)}` : ""));
  const app = safeHref(c.app, ["slack:"]);
  if (app) { const l = el("a", null, "Open in Slack"); l.href = app; l.target = "_blank"; l.rel = "noopener noreferrer"; f.append(l); }
  d.append(f);
  const w = c.work || null;
  const busy = !!(p && p.inflight);
  if (w && w.status && !CLOSED_COLS.includes(col)) d.append(workStatus(w));
  if (w && w.thread && w.thread.length) d.append(thread(c, w));
  if (!busy && col === "needs" && w && w.draft && w.canSend) {
    d.append(composer(c, "draft", "Reply drafted for Slack — edit if needed, then send", w.draft, "Send reply", "send", true));
  }
  if (!busy && openBoxes.has(c.id)) {
    const first = !w || !w.thread || !w.thread.length;
    d.append(composer(c, "msg", first ? "Note for Claude (optional)" : "Message to Claude", "",
      first ? "Ask Claude" : "Send", "ask", false));
  }
  const acts = el("div", "acts");
  const mk = (text, onclick, primary) => {
    const b = el("button", "act" + (primary ? " primary" : ""), text);
    b.type = "button"; b.disabled = busy;
    b.onclick = onclick;
    acts.append(b);
  };
  const toggle = () => { openBoxes.has(c.id) ? openBoxes.delete(c.id) : openBoxes.add(c.id); renderAll(true); };
  const talkLabel = w && w.thread && w.thread.length ? "Message" : "Ask Claude";
  if (CLOSED_COLS.includes(col)) {
    mk("Reopen", () => act(c, "reopen"), false);
    mk(talkLabel, toggle, false);
  } else {
    if (col === "ready") mk("Done", () => act(c, "done"), true);
    if (col === "todo" || col === "fyi") mk(talkLabel, toggle, true);
    else if (!openBoxes.has(c.id)) mk(talkLabel, toggle, false);
    if (col !== "ready") mk("Done", () => act(c, "done"), false);
    mk("Skip", () => act(c, "skip"), false);
  }
  d.append(acts);
  return d;
}

function workStatus(w) {
  const label = { queued: "Queued for Claude", running: "Claude is working", needs_you: "Needs you",
    waiting: "Waiting", ready: "Ready to close" }[w.status] || w.status;
  const box = el("div", "wstat");
  box.append(el("b", null, label));
  const extra = w.status === "running" && w.started ? ` · started ${ago(w.started)}`
    : w.sending ? " · sending your reply" : "";
  if (extra) box.append(document.createTextNode(extra));
  if (w.summary && w.status !== "running" && w.status !== "queued") box.append(document.createTextNode(` — ${w.summary}`));
  return box;
}

function thread(c, w) {
  const det = el("details", "thread");
  det.open = openBoxes.has(`t:${c.id}`);
  det.ontoggle = () => { det.open ? openBoxes.add(`t:${c.id}`) : openBoxes.delete(`t:${c.id}`); };
  det.append(el("summary", null, `Thread (${w.thread.length})`));
  const WHO = { duong: "You", claude: "Claude", bot: "Bot" };
  for (const m of w.thread) {
    const kind = WHO[m.from] ? m.from : "bot";
    const box = el("div", `msg ${kind}`);
    box.append(el("span", "who", `${WHO[kind]} · ${ago(m.at)}`), document.createTextNode(m.text || ""));
    det.append(box);
  }
  return det;
}

function composer(c, key, label, initial, button, action, isDraft) {
  const box = el("div", "compose" + (isDraft ? " draft" : ""));
  const id = `cmp-${key}-${c.id.replace(/[^a-zA-Z0-9]/g, "_")}`;
  const lab = el("label", null, label); lab.htmlFor = id;
  const ta = el("textarea"); ta.id = id;
  const k = `${c.id}|${key}`;
  ta.value = typed.has(k) ? typed.get(k) : initial;
  ta.oninput = () => typed.set(k, ta.value);
  const row = el("div", "acts");
  const send = el("button", "act primary", button); send.type = "button";
  send.onclick = () => {
    const text = ta.value.trim();
    if (action === "send" && !text) { toast("The reply is empty.", true); return; }
    act(c, action, text);
  };
  row.append(send);
  box.append(lab, ta, row);
  return box;
}

function sortKey(col) {
  const t = x => new Date(x).getTime() || 0;
  return col === "todo" || col === "fyi"
    ? (a, b) => (PRI[a.priority] ?? 1) - (PRI[b.priority] ?? 1) || (b.news ? 1 : 0) - (a.news ? 1 : 0) || t(b.seen) - t(a.seen)
    : (a, b) => t(b.closed || b.seen) - t(a.closed || a.seen);
}

function render() {
  const board = $("board");
  const tabs = $("tabs");
  board.replaceChildren();
  tabs.replaceChildren();
  const n = activeFilterCount();
  $("ftoggle").textContent = n ? `Filters (${n})` : "Filters";
  tabs.hidden = !DATA;
  if (!DATA) return;
  const days = DATA.recentDays || 7;
  for (const col of COLS) {
    const list = DATA.cards.filter(c => effectiveCol(c) === col.id && matches(c)).sort(sortKey(col.id));
    const tab = el("button", "tab" + (state.tab === col.id ? " on" : ""));
    tab.type = "button";
    tab.dataset.col = col.id;
    tab.append(el("span", "n", String(list.length)), el("span", null, col.short));
    tab.onclick = () => { state.tab = col.id; store("set", "task-board-tab", col.id); render(); window.scrollTo(0, 0); };
    tabs.append(tab);

    const box = el("section", "col" + (state.tab === col.id ? " active" : ""));
    box.dataset.col = col.id;
    const h = el("h2", null, col.name);
    h.append(el("span", "n", String(list.length)));
    box.append(h);
    const hint = col.hint(days);
    if (hint) box.append(el("div", "hint", hint));
    const cards = el("div", "cards");
    const limit = state.shown[col.id] || PAGE;
    list.slice(0, limit).forEach(c => cards.append(card(c)));
    if (!list.length) cards.append(el("div", "empty", "Nothing here"));
    if (list.length > limit) {
      const more = el("button", "chip more", `Show ${Math.min(PAGE, list.length - limit)} more`);
      more.type = "button";
      more.onclick = () => { state.shown[col.id] = limit + PAGE; render(); };
      cards.append(more);
    }
    box.append(cards);
    board.append(box);
  }
}
function renderAll(force) {
  // A background refresh must not wipe what is being typed or steal focus.
  const a = document.activeElement;
  if (!force && a && a.tagName === "TEXTAREA" && $("board").contains(a)) { renderDeferred = true; updateStamp(); return; }
  renderDeferred = false;
  updateStamp(); rebuildFilterOptions(); render();
}
$("board").addEventListener("focusout", () => setTimeout(() => {
  const a = document.activeElement;
  if (renderDeferred && !(a && a.tagName === "TEXTAREA" && $("board").contains(a))) renderAll();
}, 0));

/* ---------- refresh loop ---------- */
$("refresh").onclick = () => load();
setInterval(() => { if (!document.hidden && token() && errorKind !== "auth") load(); }, REFRESH_MS);
setInterval(updateStamp, 30 * 1000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && token() && errorKind !== "auth") load();
});

if (token()) { showApp(); load(); } else showSetup();
</script>
</body>
</html>
